<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131C"/>
      <stop offset="100%" stop-color="#08090E"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Rect Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Siphon Stream Geometry -->
  <g filter="url(#glow)">
    <!-- Outer Inverted Funnel / Siphon Tube -->
    <path d="M 128 140
             C 128 140, 200 120, 256 120
             C 312 120, 384 140, 384 140
             C 384 140, 340 240, 304 280
             C 284 302, 280 340, 280 376
             C 280 398, 269 416, 256 416
             C 243 416, 232 398, 232 376
             C 232 340, 228 302, 208 280
             C 172 240, 128 140, 128 140 Z"
          fill="none"
          stroke="url(#streamGrad)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Concentric Flow Ripple -->
    <path d="M 176 190
             C 216 170, 296 170, 336 190
             C 316 240, 288 270, 276 300
             C 264 330, 260 360, 256 380"
          fill="none"
          stroke="url(#streamGrad)"
          stroke-width="16"
          stroke-linecap="round"
          opacity="0.8"/>

    <!-- Droplet / Endpoint Core -->
    <circle cx="256" cy="400" r="14" fill="#38BDF8"/>
  </g>
</svg>
