[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siphon"
version = "0.1.0"
description = "A NewPipe-like Linux desktop application for extracting and downloading YouTube media"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "BobiButt" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pywebview>=5.1",
    "yt-dlp>=2024.10.07",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
siphon = "siphon.__main__:main"
