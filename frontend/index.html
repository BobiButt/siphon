<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siphon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Siphon</h1>
            <p>NewPipe-inspired YouTube Downloader for Linux</p>
        </header>
        <main>
            <section id="url-input-section">
                <input type="text" id="url-input" placeholder="Paste YouTube URL here..." autocomplete="off">
                <button id="extract-btn">Inspect</button>
            </section>
            <section id="results-section"></section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
